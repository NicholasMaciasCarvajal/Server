name: Builder Imagen Insana 2

on:
  workflow_dispatch: 

permissions:
  contents: read
  packages: write
  
jobs:
  revisar:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint A
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore:  DL3008, DL4006, DL3020
  
  construir-linux:
    needs: revisar
    runs-on: Linux #linux

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t servidor-minecraft:latest .

      - name: Exportar imagen
        run: docker save servidor-minecraft:latest -o servidor.tar 

      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-linux
          path: servidor.tar
          compression-level: 0

  construir-windows:
    needs: revisar
    runs-on: Windows #windows
    
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Construir imagen en Windows
        shell: pwsh
        run: docker build -t servidor-minecraft:latest .

      - name: Exportar imagen
        shell: pwsh
        run: docker save servidor-minecraft:latest -o servidor-win.tar 

      - name: Subir imagen
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-windows
          path: servidor-win.tar
          compression-level: 0

  importar-linux:
    runs-on: Linux #linux
    needs: construir-linux

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: imagen-docker-linux

      - name: Cargar imagen de docker
        run: docker load -i servidor.tar

      - name: Verificar importacion
        run: |
          docker images
          docker inspect servidor-minecraft:latest

  importar-windows:
    runs-on: Windows #Windows
    needs: construir-windows

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: imagen-docker-windows

      - name: Verificar Imagen
        shell: pwsh
        run: Get-Item servidor-win.tar

      - name: Cargar imagen de docker
        shell: pwsh
        run: docker load -i servidor-win.tar

      - name: Verificar importacion
        shell: pwsh
        run: |
          docker images
          docker inspect servidor-minecraft:latest





          
